services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stroy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stroy_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stroy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stroy_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-stroy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stroy_db}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: SparkLLM/Spark-X2.5-1.7B
      OLLAMA_EMBED_MODEL: bge-m3
      OLLAMA_EMBED_DIMENSIONS: "1024"
      OLLAMA_NUM_CTX: "1536"
      RAG_MAX_CONTEXT_CHARS: "2000"
      RAG_MAX_CHUNK_CHARS_FOR_EMBED: "1500"
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/samples:/app/data/samples:ro

  ollama:
    profiles:
      - ollama
    image: ollama/ollama:0.34.1
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
