[project]
name = "stroy-objects-ai"
version = "0.1.0"
description = "Учёт строительных объектов и ИИ-помощник по нормативным документам"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["E501", "I001", "UP007", "UP035"]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
