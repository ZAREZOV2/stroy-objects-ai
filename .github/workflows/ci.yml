name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stroy
          POSTGRES_PASSWORD: stroy
          POSTGRES_DB: stroy_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stroy -d stroy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://stroy:stroy@localhost:5432/stroy_db
          DATABASE_URL: postgresql+asyncpg://stroy:stroy@localhost:5432/stroy_db
          DATABASE_URL_SYNC: postgresql://stroy:stroy@localhost:5432/stroy_db
        run: pytest -q
